name: Gluetun lab static QA
on:
  push:
    paths:
      - 'labs/proton-gluetun/**'
      - 'scripts/qa-proton-gluetun.mjs'
      - '.github/workflows/gluetun-lab-qa.yml'
  pull_request:
    paths:
      - 'labs/proton-gluetun/**'
      - 'scripts/qa-proton-gluetun.mjs'
      - '.github/workflows/gluetun-lab-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check lab security policy
        run: node scripts/qa-proton-gluetun.mjs
      - name: Validate Compose syntax without secrets
        env:
          GLUETUN_IMAGE: qmcgaw/gluetun@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          NETSHOOT_IMAGE: nicolaka/netshoot@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          WIREGUARD_PRIVATE_KEY: ci-placeholder-not-a-real-key
        run: docker compose -f labs/proton-gluetun/compose.yaml config --quiet
