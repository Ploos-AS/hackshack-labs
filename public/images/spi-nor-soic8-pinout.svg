<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Typical SPI NOR flash SOIC8 pin numbering</title><desc id="desc">Top view of a common 25-series SPI NOR flash package. Pin 1 chip select, pin 2 data out, pin 3 write protect, pin 4 ground, pin 5 data in, pin 6 clock, pin 7 hold, pin 8 supply. Confirm actual datasheet before wiring.</desc>
<rect width="960" height="500" rx="16" fill="#101820"/><g font-family="system-ui,sans-serif" fill="#e7f4ef">
<text x="32" y="42" font-size="25" font-weight="700">SPI NOR SOIC8 — common 25-series pinout (top view)</text>
<rect x="353" y="105" width="254" height="285" rx="22" fill="#283c44" stroke="#80e1b0" stroke-width="3"/>
<path d="M445 105 a35 35 0 0 0 70 0" fill="#101820"/><circle cx="390" cy="151" r="8" fill="#ffbe69"/>
<g fill="#b7dacc"><rect x="326" y="146" width="27" height="34"/><rect x="326" y="211" width="27" height="34"/><rect x="326" y="276" width="27" height="34"/><rect x="326" y="341" width="27" height="34"/><rect x="607" y="146" width="27" height="34"/><rect x="607" y="211" width="27" height="34"/><rect x="607" y="276" width="27" height="34"/><rect x="607" y="341" width="27" height="34"/></g>
<g font-size="20"><text x="230" y="170">1  /CS</text><text x="230" y="235">2  DO / MISO</text><text x="230" y="300">3  /WP</text><text x="230" y="365">4  GND</text><text x="665" y="170">8  VCC</text><text x="665" y="235">7  /HOLD</text><text x="665" y="300">6  CLK</text><text x="665" y="365">5  DI / MOSI</text></g>
<text x="381" y="252" font-size="21" font-weight="700">SPI NOR</text><text x="393" y="283" font-size="16">Pin 1 dot</text>
<text x="36" y="432" font-size="17" fill="#ffbf66" font-weight="700">Illustration only — not a universal wiring prescription.</text>
<text x="36" y="459" font-size="16">Confirm exact chip datasheet, supply and I/O voltage (1.8 V vs 3.3 V), orientation and programmer levels.</text>
<text x="36" y="483" font-size="16">Disconnect board power; in-circuit clips can back-power or load the SPI bus.</text>
</g></svg>